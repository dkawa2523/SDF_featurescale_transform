task: transform-eval

input:
  index: ../../data/examples/transform_cases.csv

view:
  axes: [x, z]
  depth_axis: y

eval:
  features:
    - target_shape: full_shape
      method: sdf
    - target_shape: full_shape
      method: multi_scale_tsdf
    - target_shape: full_shape
      method: udf
    - target_shape: material_shape
      method: sdf
    - target_shape: material_shape
      method: multi_scale_tsdf
    - target_shape: material_shape
      method: udf

output:
  dir: ../../outputs/example_transform_eval
