task: transform

input:
  simulation:
    kind: npz_label
    path: ../../data/examples/sim_case.npz
    # void_id: 0  # required when material id 0 is not present

view:
  axes: [x, z]
  depth_axis: y

features:
  use: [sdf, mesh, contour, slice]
  # Optional 3D raw signed distance for downstream analysis or learning:
  # use: [sdf_raw]
  # Optional 3D TSDF views derived from sdf_raw:
  # use: [tsdf_views]

output:
  dir: ../../outputs/example_transform
