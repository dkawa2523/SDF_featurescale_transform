task: transform

input:
  simulation:
    kind: npz_label
    path: ../../data/examples/sim_case.npz
    # void_id: 0  # required when material id 0 is not present

view:
  axes: [x, z]
  depth_axis: y

features:
  use: [sdf_raw, tsdf_views, udf, material_sdf]
  # For process-delta shape, add input.reference, set process.enabled: true,
  # and use process_delta_sdf, process_delta_tsdf_views, or process_delta_udf.

output:
  dir: ../../outputs/example_transform
