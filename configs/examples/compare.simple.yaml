task: compare

input:
  simulation:
    kind: npz_label
    path: ../../data/examples/sim_case.npz
    # void_id: 0  # required when material id 0 is not present

  target:
    kind: npz_label
    path: ../../data/examples/target_case.npz

view:
  axes: [x, z]
  depth_axis: y

features:
  # Compare features are intermediate representations used by metrics.
  # Required features by metric:
  # - cd, chamfer, profile, corner: contour
  # - sdf, sdf_band, sdf_material: sdf
  # - iou, topology: no extra feature
  use: [sdf, contour]

metrics:
  # Metrics are losses computed from the features above.
  # Example: feature "sdf" builds an SDF field; metric "sdf" compares
  # simulation and target SDF fields.
  use: [cd, sdf, iou]
  # Optional diagnostics:
  # - chamfer: boundary point distance
  # - sdf_material: per-material SDF loss
  # - sdf_band: 10 nm boundary-neighborhood SDF loss
  # use: [cd, sdf, iou, chamfer, sdf_material, sdf_band]
  # Optional: focus CD on selected label-volume materials.
  # If omitted, label-volume CD automatically scores internal material-boundary
  # transitions and records the default center-line width profile.
  # cd:
  #   material_ids: [2]
  #   gauge:
  #     axis: x
  #     height_axis: z
  #     center: 4.0
  #     height_range: [0.0, 10.0]

output:
  dir: ../../outputs/example_compare
  difference_image: true
