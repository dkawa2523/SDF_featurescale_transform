task: compare-eval

input:
  index: dataset_t08_npz_compare_eval_pairs.csv

view:
  axes: [x, z]
  depth_axis: y

eval:
  metric_sets:
    height_cd:
      features:
        use: [contour]
      metrics:
        use: [cd]
    shape_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou]
    material_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou, sdf_material]
    boundary_band_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou, sdf_band]

output:
  dir: ../../outputs/realdata_dataset_t08_npz_compare_eval

