task: compare-eval

input:
  index: dataset_t08_vs_run0010_pairs.csv

view:
  axes: [x, z]
  depth_axis: y

eval:
  # Each metric_sets key is an evaluation axis.
  # Required compare features by metric:
  # - cd, chamfer, profile, corner: contour
  # - sdf, sdf_band, sdf_material: sdf
  # - iou, topology: no extra feature
  metric_sets:
    height_cd:
      features:
        use: [contour]
      metrics:
        use: [cd]
    shape_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou]
    material_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou, sdf_material]
    boundary_band_distance:
      features:
        use: [sdf, contour]
      metrics:
        use: [sdf, iou, sdf_band]

output:
  dir: ../../outputs/realdata_dataset_t08_compare_eval

