task: transform-eval

input:
  index: dataset_t08_npz_transform_eval_cases.csv

view:
  axes: [x, z]
  depth_axis: y

process:
  enabled: true

eval:
  features:
    - target_shape: full_shape
      method: sdf
    - target_shape: full_shape
      method: multi_scale_tsdf
    - target_shape: full_shape
      method: udf
    - target_shape: material_shape
      method: sdf
    - target_shape: material_shape
      method: multi_scale_tsdf
    - target_shape: material_shape
      method: udf
    - target_shape: process_delta_shape
      method: sdf
    - target_shape: process_delta_shape
      method: multi_scale_tsdf
    - target_shape: process_delta_shape
      method: udf

output:
  dir: ../../outputs/realdata_dataset_t08_npz_transform_eval
